name: Build Release

on:
  push:
    tags:
      - "v*"

env:
    PROJECT_NAME: "ChatApp"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION_NUMERIC=${VERSION%%-*}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUMERIC=$VERSION_NUMERIC" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: set up jdk22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: inject api config
        shell: bash
        run: |
          sed -i '/import io\.github\.cdimascio\.dotenv\.Dotenv;/d' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java
          sed -i '/private static final Dotenv dotenv = Dotenv\.load();/d' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java

          sed -i 's|public static final String BASE_URL = dotenv\.get("BASE_URL");|public static final String BASE_URL = "${{ secrets.BASE_URL }}";|' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java

      - name: build maven project
        run: mvn -B clean package

      - name: Detect Built JAR Filename
        id: detectjar
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path "target" -Filter "ChatApp.jar" |
                 Select-Object -First 1

          if (-not $jar) { throw "ChatApp.jar not found in target/"; }

          echo "JAR_NAME=$($jar.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Using JAR: $($jar.Name)"

      - name: create jre embedded exe
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --input target `
            --main-jar "${{ steps.detectjar.outputs.JAR_NAME }}" `
            --name ${{ env.PROJECT_NAME }} `
            --app-version "${{ steps.version.outputs.VERSION_NUMERIC }}" `
            --icon "icons/app-icon.ico" `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser `
            --verbose `
            --dest dist

      - name: rename exe with version
        shell: pwsh
        run: |
          $oldName = "dist/${{ env.PROJECT_NAME }}-${{ steps.version.outputs.VERSION }}.exe"
          $newName = "dist/${{ env.PROJECT_NAME }}_${{ steps.version.outputs.VERSION }}.exe"
          if (Test-Path $oldName) {
            Move-Item -Path $oldName -Destination $newName
            Write-Host "Renamed to: $newName"
          }

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: extract version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION_NUMERIC=${VERSION%%-*}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUMERIC=$VERSION_NUMERIC" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: set up jdk22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: inject api config
        shell: bash
        run: |
          sed -i '/import io\.github\.cdimascio\.dotenv\.Dotenv;/d' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java
          sed -i '/private static final Dotenv dotenv = Dotenv\.load();/d' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java

          sed -i 's|public static final String BASE_URL = dotenv\.get("BASE_URL");|public static final String BASE_URL = "${{ secrets.BASE_URL }}";|' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java

      - name: build maven project
        run: mvn -B clean package

      - name: detect built jar filename
        id: detectjar
        shell: bash
        run: |
          if [ ! -f target/ChatApp.jar ]; then
            echo "Error: ChatApp.jar not found in target/"
            ls -la target/*.jar
            exit 1
          fi
          echo "JAR_NAME=ChatApp.jar" >> $GITHUB_OUTPUT
          echo "Using JAR: ChatApp.jar"

      - name: install required build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      - name: create jre embedded deb
        shell: bash
        run: |
          jpackage \
            --type deb \
            --input target \
            --main-jar "${{ steps.detectjar.outputs.JAR_NAME }}" \
            --name ${{ env.PROJECT_NAME }} \
            --app-version "${{ steps.version.outputs.VERSION_NUMERIC }}" \
            --icon "icons/app-icon.png" \
            --linux-shortcut \
            --linux-deb-maintainer "maintainer@example.com" \
            --linux-app-category "Office" \
            --linux-menu-group "Office" \
            --verbose \
            --dest dist

      - name: rename deb with version
        shell: bash
        run: |
          old_name="dist/${PROJECT_NAME,,}_${{ steps.version.outputs.VERSION }}-1_amd64.deb"
          new_name="dist/${{ env.PROJECT_NAME }}_${{ steps.version.outputs.VERSION }}.deb"
          if [ -f "$old_name" ]; then
            mv "$old_name" "$new_name"
            echo "Renamed to: $new_name"
          fi

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.deb

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: extract version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION_NUMERIC=${VERSION%%-*}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUMERIC=$VERSION_NUMERIC" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: set up jdk22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: inject api config
        shell: bash
        run: |
          sed -i '' '/import io\.github\.cdimascio\.dotenv\.Dotenv;/d' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java
          sed -i '' '/private static final Dotenv dotenv = Dotenv\.load();/d' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java

          sed -i '' 's|public static final String BASE_URL = dotenv\.get("BASE_URL");|public static final String BASE_URL = "${{ secrets.BASE_URL }}";|' src/main/java/com/fyuxera/chatapp/api/config/ApiConfig.java

      - name: build maven project
        run: mvn -B clean package

      - name: detect built jar filename
        id: detectjar
        shell: bash
        run: |
          if [ ! -f target/ChatApp.jar ]; then
            echo "Error: ChatApp.jar not found in target/"
            ls -la target/*.jar
            exit 1
          fi
          echo "JAR_NAME=ChatApp.jar" >> $GITHUB_OUTPUT
          echo "Using JAR: ChatApp.jar"

      - name: create jre embedded dmg
        shell: bash
        run: |
          jpackage \
            --type dmg \
            --input target \
            --main-jar "${{ steps.detectjar.outputs.JAR_NAME }}" \
            --name ${{ env.PROJECT_NAME }} \
            --app-version "${{ steps.version.outputs.VERSION_NUMERIC }}" \
            --icon "icons/app-icon.icns" \
            --mac-package-name ${{ env.PROJECT_NAME }} \
            --verbose \
            --dest dist

      - name: rename dmg with version
        shell: bash
        run: |
          old_name="dist/${{ env.PROJECT_NAME }}-${{ steps.version.outputs.VERSION }}.dmg"
          new_name="dist/${{ env.PROJECT_NAME }}_${{ steps.version.outputs.VERSION }}.dmg"
          if [ -f "$old_name" ]; then
            mv "$old_name" "$new_name"
            echo "Renamed to: $new_name"
          fi

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: download windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: download linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist

      - name: download macos build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist

      - name: upload release assets
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}